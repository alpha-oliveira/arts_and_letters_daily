<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALDaily Summarizer Settings</title>
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1>ALDaily Summarizer</h1>
    <form id="settings-form">
      <label for="api-key">Groq API key</label>
      <input id="api-key" name="api-key" type="password" autocomplete="new-password" spellcheck="false" required>
      <p class="hint">Stored in this browser profile using Chrome extension storage. It is not included in the extension files.</p>

      <label for="model">Groq model ID</label>
      <input id="model" name="model" type="text" value="openai/gpt-oss-20b" spellcheck="false" required>
      <p class="hint">Use a chat model enabled for your Groq account.</p>

      <div class="actions">
        <button type="submit">Save settings</button>
        <button id="remove-key" class="secondary" type="button">Remove key</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
